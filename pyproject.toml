[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cmdstash"
dynamic = ["version"]
description = "CLI to stash, organize, and find terminal commands."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
  "cyclopts",
  "platformdirs",
  "rich",
]

[project.scripts]
cmdstash = "cmdstash.cli:main"

[tool.hatch.version]
path = "src/cmdstash/__about__.py"

[tool.ruff]
target-version = "py314"
line-length = 100

[dependency-groups]
dev = [
  "ipython>=9.10.0",
  "pytest",
  "pytest-cov>=7.0.0",
  "ruff",
]
